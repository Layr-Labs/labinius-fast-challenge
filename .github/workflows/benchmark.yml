name: Trusted runner registration smoke test

on:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    if: github.repository == 'Layr-Labs/labinius-fast-challenge' && github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        host:
          - labinius-avx512-01
          - labinius-avx512-02
          - labinius-avx512-03
    timeout-minutes: 5
    runs-on:
      group: labinius-intel-8488c-avx512-c7i
      labels:
        - self-hosted
        - labinius-avx512-c7i
        - ${{ matrix.host }}
    env:
      RUSTUP_HOME: /opt/rustup
      CARGO_HOME: /opt/cargo
      CC: /usr/bin/gcc-13
    steps:
      - name: Verify trusted runner
        shell: bash
        run: |
          set -euo pipefail

          test "$(id -u)" = "1100"
          ! id -nG | tr ' ' '\n' | grep -Exq '(sudo|docker)'
          if command -v sudo >/dev/null 2>&1; then
            ! sudo -n true >/dev/null 2>&1
          fi

          test "$RUSTUP_HOME" = "/opt/rustup"
          test "$CARGO_HOME" = "/opt/cargo"
          test "$CC" = "/usr/bin/gcc-13"
          test -x "$CC"

          rustc_version="$(rustc --version)"
          cargo_version="$(cargo --version)"
          [[ "$rustc_version" =~ ^rustc\ 1\.99\. ]]
          [[ "$cargo_version" =~ ^cargo\ 1\.99\. ]]

          test -x /usr/local/bin/validate-cpu
          test ! -w /usr/local/bin/validate-cpu
          /usr/local/bin/validate-cpu

          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = "1"
          bwrap_path="$(command -v bwrap)"
          test ! -u "$bwrap_path"
          "$bwrap_path" --ro-bind / / --dev /dev --proc /proc --unshare-pid --unshare-net --die-with-parent /usr/bin/true

          imds_exit=0
          imds_http="$(curl --noproxy '*' --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 2 --max-time 3 http://169.254.169.254/latest/meta-data/)" || imds_exit=$?
          test "$imds_exit" -ne 0
          test "$imds_http" = "000"

          lscpu | grep -E '^(Architecture|CPU\(s\)|Model name|Flags):'
          printf '%s\n' "$rustc_version" "$cargo_version"
          echo "TRUSTED_RUNNER_SMOKE_PASS"
