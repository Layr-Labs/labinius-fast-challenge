name: Benchmark

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

# blacksmith-16vcpu-ubuntu-2404 does not guarantee AVX-512. Each attempt is a
# new machine. A machine without avx512f does not compile or upload a score.
jobs:
  benchmark:
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      AVX_REQUIRED: soft
    outputs:
      avx: ${{ steps.avx.outputs.avx }}
    steps: &steps
      - name: Require AVX-512
        id: avx
        run: |
          if grep -qw avx512f /proc/cpuinfo; then
            echo "avx=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "avx=missing" >> "$GITHUB_OUTPUT"
          echo "runner has no AVX-512" >&2
          grep -m1 '^flags' /proc/cpuinfo >&2 || true
          if [ "$AVX_REQUIRED" = "hard" ]; then
            exit 1
          fi

      - name: Checkout
        if: steps.avx.outputs.avx == 'ok'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install bubblewrap
        if: steps.avx.outputs.avx == 'ok'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "TRUSTED_DIR=$RUNNER_TEMP/labinius-trusted" >> "$GITHUB_ENV"

      - name: Setup
        if: steps.avx.outputs.avx == 'ok'
        run: bash .yukon/setup.sh

      - name: Benchmark
        if: steps.avx.outputs.avx == 'ok'
        run: bash .yukon/benchmark.sh

      - name: Upload score
        if: always() && steps.avx.outputs.avx == 'ok'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-score
          path: .yukon/labinius-fast-score.json
          if-no-files-found: error

  benchmark-retry:
    needs: benchmark
    if: needs.benchmark.outputs.avx == 'missing'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      AVX_REQUIRED: soft
    outputs:
      avx: ${{ steps.avx.outputs.avx }}
    steps: *steps

  benchmark-retry-2:
    needs: [benchmark, benchmark-retry]
    if: needs.benchmark.outputs.avx == 'missing' && needs.benchmark-retry.outputs.avx == 'missing'
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      AVX_REQUIRED: hard
    outputs:
      avx: ${{ steps.avx.outputs.avx }}
    steps: *steps
