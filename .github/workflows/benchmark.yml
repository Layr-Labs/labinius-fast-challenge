name: Benchmark

on:
  workflow_dispatch:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string
  workflow_call:
    inputs:
      solution_repository:
        description: Repository containing the untrusted solution
        required: false
        type: string
      solution_ref:
        description: Immutable commit containing the untrusted solution
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: benchmark-${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}-${{ inputs.solution_ref || github.sha }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Keep this dispatch/call workflow's filename and run head for Yukon
    # correlation, while runner admission is bound to the protected executor.
    uses: Layr-Labs/labinius-fast-challenge/.github/workflows/benchmark-runner.yml@master
    with:
      solution_repository: ${{ inputs.solution_repository || github.repository }}
      solution_ref: ${{ inputs.solution_ref || github.sha }}
