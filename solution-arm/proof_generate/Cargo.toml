[package]
name = "labinius-pcs-challenge"
version = "0.1.0"
edition = "2021"

# Independent workspace: the implementation can be replaced by a fresh checkout.
[workspace]
resolver = "2"

[[bin]]
name = "labinius-fast"
path = "src/main.rs"

[dependencies]
labinius = { path = "../labinius/crates/pcs" }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

# The build script precomputes the hybrid commitment matrix with the prover's own NEON kernels.
[build-dependencies]
labinius = { path = "../labinius/crates/pcs" }
blake3 = "1.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The build script runs the transforms to precompute the matrix; compile it optimised.
[profile.release.build-override]
opt-level = 3
