[package]
name = "labinius-native-diagnostics"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"

[features]
fixture = []

[lib]
name = "labinius_control"
path = "src/control_lib.rs"

[[bin]]
name = "baseline-control"
path = "src/bin/baseline_control.rs"

[[bin]]
name = "candidate-c"
path = "src/bin/candidate_c.rs"

[[test]]
name = "candidate-c-focused"
path = "tests/candidate_c_focused.rs"
required-features = ["fixture"]

[[test]]
name = "prover-round-trip"
path = "../proof_generate/src/main.rs"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
labinius = { path = "../labinius/crates/pcs" }
blake3 = "=1.8.7"
serde = { version = "=1.0.229", features = ["derive"] }
bincode = "=1.3.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.release.build-override]
opt-level = 3
