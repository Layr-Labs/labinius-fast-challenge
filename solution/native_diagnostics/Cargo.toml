[package]
name = "labinius-native-diagnostics"
version = "0.1.0"
edition = "2021"

[workspace]
resolver = "2"

[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
labinius = { path = "../labinius/crates/pcs" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
