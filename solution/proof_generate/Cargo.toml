[package]
name = "labinius-pcs-challenge"
version = "0.1.0"
edition = "2021"

# Independent workspace: the implementation can be replaced by a fresh checkout.
[workspace]
resolver = "2"

[[bin]]
name = "labinius-fast"
path = "src/main.rs"

[dependencies]
labinius = { path = "../labinius/crates/pcs" }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# The score is the whole sandboxed process, including paging the binary in.
# Fat LTO keeps the NTT kernels; the symbol table does not need to come with them.
strip = "symbols"
