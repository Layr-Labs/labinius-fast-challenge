[package]
name = "labinius-pcs-challenge"
version = "0.1.0"
edition = "2021"

# Independent workspace for the fixed checker and its trusted implementation.
[workspace]
resolver = "2"

[[bin]]
name = "labinius-fast-verify"
path = "src/main.rs"

[dependencies]
labinius = { path = "../labinius/crates/pcs" }
blake3 = "1.8"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
